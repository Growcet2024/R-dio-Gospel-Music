  <!-- ################################################################
       2) STYLE
       ################################################################ -->
  <style>

    /* ==============================================================
       CORES DA PÁGINA (todas juntas aqui)
       Para trocar uma cor, mude só o código aqui.
       ============================================================== */
    :root {
      /* Fundo da página (degradê de cima para baixo) */
      --fundo-topo: #fff5f7;        /* topo: rosa bem clarinho */
      --fundo-meio: #ffffff;        /* meio: branco */
      --fundo-base: #eef6fc;        /* base: azul bem clarinho */

      /* Roxo padrão do app */
      --roxo: #7533EF;              /* título, botão, aviso, seta de voltar */
      --roxo-escuro: #5a1fd1;       /* borda do botão e botão apertado */

      /* Textos */
      --texto: #000000;             /* cor da frase */
      --branco: #ffffff;            /* texto do botão e do aviso */

      /* Amostra do vídeo: borda e sombra */
      --borda: rgba(59, 130, 196, 0.20);
      --sombra-roxa: rgba(117, 51, 239, 0.15);

      /* Laterais da amostra do vídeo (o vídeo é vertical e o quadrado
         tem sobras dos lados). Combine com o FUNDO do vídeo:
         - degradê: coloque duas cores diferentes (cima e baixo)
         - cor única: coloque a mesma cor nas duas
         O vídeo genérico atual tem fundo roxo liso. Na tela ele aparece
         como #7533E7 (um pouquinho diferente de #7533EF por causa da
         compressão do vídeo). Para o vídeo OFICIAL, ajuste estas cores
         até as laterais ficarem sem emenda com o vídeo. */
      --lateral-cima: #7533E7;
      --lateral-baixo: #7533E7;
    }


    /* ==============================================================
       BASE DA PÁGINA
       ============================================================== */

    /* ===== DESATIVAR SELEÇÃO DE TEXTO ===== */
    body {
      -webkit-user-select: none;
      user-select: none;
    }

    /* ===== REMOVE O FLASH AZUL AO TOCAR EM BOTÕES E LINKS ===== */
    * {
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== FUNDO DA PÁGINA (igual à página Sobre) ===== */
    body {
      margin: 0;
      min-height: 100vh;     /* altura exata da tela - sem rolagem */
      overflow: hidden;      /* trava a rolagem */
      padding-top: 50px;     /* margem do topo (padrão das páginas) */
      box-sizing: border-box;
      background: linear-gradient(180deg, var(--fundo-topo) 0%, var(--fundo-meio) 50%, var(--fundo-base) 100%);
      background-attachment: fixed;
      font-family: Arial, sans-serif;
    }

    /* ===== BOTÃO VOLTAR ===== */
    .botao-voltar {
      position: fixed;
      top: 15px;
      left: 15px;
      text-decoration: none;
      color: var(--roxo);
      font-size: 20px;
      font-weight: bold;
    }


    /* ==============================================================
       CONTEÚDO (título, frase, amostra do vídeo e botão)
       ============================================================== */
    .conteudo-banner {
      width: 90%;
      max-width: 650px;
      margin: 0 auto 40px;
      box-sizing: border-box;
      text-align: center;
    }

    /* ===== TÍTULO ===== */
    .conteudo-banner h1 {
      margin: 12px 0 10px;
      color: var(--roxo);
      font-size: 20px;
      line-height: 1.4;
      font-weight: 600;
    }

    /* ===== FRASE ===== */
    .conteudo-banner p {
      margin: 0 0 20px;
      color: var(--texto);
      font-size: 15px;
      line-height: 1.7;
    }


    /* ==============================================================
       AMOSTRA DO VÍDEO
       Um quadrado com o vídeo (vertical) inteiro no meio.
       Toque nele para assistir, pausar ou rever.
       ============================================================== */
    .video-share {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 100%;       /* altura = largura (quadrado), compatível com celulares antigos */
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid var(--borda);
      box-shadow: 0 4px 14px var(--sombra-roxa);
      overflow: hidden;
      cursor: pointer;
      background: linear-gradient(180deg, var(--lateral-cima), var(--lateral-baixo));
    }

    /* Imagem provisória (banner oficial) enquanto o vídeo não carrega */
    .video-share .capa-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* O vídeo, por cima, na altura completa do quadrado.
       Começa invisível e aparece quando o primeiro quadro carrega. */
    .video-share video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: transparent;
      opacity: 0;
      transition: opacity .25s;
    }

    /* Botão de play (e de rever) sobre a amostra */
    .video-share .play-mini {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px;
      height: 60px;
      margin: -30px 0 0 -30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .25);
      border: 1px solid rgba(255, 255, 255, .55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: opacity .2s;
    }

    .video-share .play-mini svg {
      width: 26px;
      height: 26px;
      fill: var(--branco);
    }

    .video-share .play-mini .i-play {
      margin-left: 3px;
    }

    /* Ícone de rever: só aparece quando o vídeo termina */
    .video-share .play-mini .i-replay {
      display: none;
    }

    /* Estado "tocando": o botão some para não atrapalhar o vídeo */
    .estado-tocando .play-mini {
      opacity: 0;
      pointer-events: none;
    }

    /* Estado "fim": o vídeo fica parado no último quadro e o botão
       de rever vai para o cantinho */
    .estado-fim .play-mini {
      top: auto;
      left: auto;
      right: 10px;
      bottom: 10px;
      width: 44px;
      height: 44px;
      margin: 0;
    }

    .estado-fim .play-mini .i-play {
      display: none;
    }

    .estado-fim .play-mini .i-replay {
      display: block;
      width: 22px;
      height: 22px;
    }


    /* ==============================================================
       BOTÃO ENVIAR
       ============================================================== */
    .botao-enviar {
      position: relative;    /* necessário para o brilho do topo */
      overflow: hidden;      /* mantém o brilho dentro do botão */
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: 1px solid var(--roxo-escuro);
      border-radius: 10px;
      background: var(--roxo);
      color: var(--branco);
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow:
        0 3px 8px rgba(117, 51, 239, 0.30),       /* sombra de fora */
        inset 0 -2px 4px rgba(0, 0, 0, 0.15);     /* relevo embaixo */
    }

    /* ===== BRILHO NO TOPO DO BOTÃO ===== */
    .botao-enviar::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 35%;           /* altura do brilho */
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    /* ===== EFEITO AO TOCAR NO BOTÃO ===== */
    .botao-enviar:active {
      background: var(--roxo-escuro);
    }

    /* ===== BOTÃO ENQUANTO BAIXA O VÍDEO ===== */
    .botao-enviar:disabled {
      opacity: .65;
    }


    /* ==============================================================
       AVISO (aparece embaixo da tela)
       ============================================================== */
    .aviso {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--roxo);
      color: var(--branco);
      font-size: 14px;
      text-align: center;
      max-width: 85%;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    .aviso.ativo {
      opacity: 1;
    }

  </style>
</head>

      <div class="play-mini">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-replay" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </div>
    </div>

    <!-- Botão enviar (para trocar o texto, edite aqui) -->
    <button id="videoBtn" class="botao-enviar">Enviar vídeo</button>

  </div>

  <!-- Aviso que aparece embaixo -->
  <div id="aviso" class="aviso"></div>

  <!-- ===== BOTÃO VOLTAR ===== -->
  <a href="sobre.html" class="botao-voltar">❮</a>


  <!-- ################################################################
       4) SCRIPT (funcionamento)
       Normalmente você não precisa mexer aqui, a não ser no
       BLOCO ANDROID (item 8), que está bem marcado.
       ################################################################ -->
  <script>

    // ==============================================================
    // 1) ELEMENTOS DA TELA
    // ==============================================================
    var videoCaixa = document.getElementById("videoCaixa");
    var videoEl = document.getElementById("videoEl");
    var capaImg = document.getElementById("capaImg");
    var videoBtn = document.getElementById("videoBtn");
    var avisoEl = document.getElementById("aviso");


    // ==============================================================
    // 2) TEXTOS DOS AVISOS
    // Para trocar uma mensagem, mude só o texto entre as aspas.
    // ==============================================================
    var MSG_SEM_VIDEO = "Adicione o link do vídeo no código";        // faltou colar o link
    var MSG_BAIXANDO = "Baixando o vídeo...";                         // baixando antes de enviar
    var MSG_ERRO_BAIXAR = "Não foi possível baixar o vídeo. Verifique a internet.";
    var MSG_TOQUE_DE_NOVO = "Vídeo pronto! Toque em Enviar de novo."; // o celular pediu um novo toque
    var MSG_TOQUE_PARA_ASSISTIR = "Toque de novo para assistir ao vídeo.";
    var MSG_ERRO_SHARE = "Não foi possível compartilhar.";
    var MSG_BAIXADO = "Seu aparelho não abre o compartilhar aqui. O vídeo foi baixado.";


    // ==============================================================
    // 3) AVISO NA TELA (some sozinho)
    // ==============================================================
    var avisoTimer = null;

    function avisar(texto) {
      avisoEl.textContent = texto;
      avisoEl.classList.add("ativo");
      clearTimeout(avisoTimer);
      avisoTimer = setTimeout(function () {
        avisoEl.classList.remove("ativo");
      }, 3000);
    }


    // ==============================================================
    // 4) LEITURA DAS CONFIGURAÇÕES (lá do topo do arquivo)
    // ==============================================================

    // Diz se um texto tem conteúdo (não está vazio)
    function temTexto(valor) {
      return typeof valor === "string" && valor.replace(/\s/g, "") !== "";
    }

    // Link do vídeo (lido na hora de usar; vazio se ainda não colou)
    function urlVideo() {
      return temTexto(VIDEO_URL) ? VIDEO_URL.trim() : "";
    }

    // Link completo do vídeo (começa com https://), útil para o Android
    function urlVideoCompleta() {
      try {
        return new URL(urlVideo(), window.location.href).href;
      } catch (e) {
        return urlVideo();
      }
    }

    // Imagem provisória (banner oficial) enquanto o vídeo não carrega
    if (temTexto(BANNER_BASE64)) {
      capaImg.src = BANNER_BASE64.trim();
    }


    // ==============================================================
    // 5) DOWNLOAD DO VÍDEO
    // A página baixa o vídeo uma vez e guarda. Assim a amostra toca
    // rápido e o envio sai na hora. Precisa de internet.
    // ==============================================================
    var videoBlob = null;       // vídeo já baixado
    var videoBaixando = null;   // download em andamento
    var videoLocal = "";        // endereço do vídeo baixado (usado na amostra)

    function baixarVideo() {
      if (videoBlob) {
        return Promise.resolve(videoBlob);
      }
      if (videoBaixando) {
        return videoBaixando;
      }
      var url = urlVideo();
      if (!url) {
        return Promise.reject(new Error("sem-link"));
      }
      videoBaixando = fetch(url).then(function (resp) {
        if (!resp.ok) {
          throw new Error("erro-" + resp.status);
        }
        return resp.blob();
      }).then(function (b) {
        videoBlob = (b.type === "video/mp4") ? b : new Blob([b], { type: "video/mp4" });
        videoBaixando = null;
        return videoBlob;
      }).catch(function (e) {
        videoBaixando = null;
        throw e;
      });
      return videoBaixando;
    }

    // Coloca o vídeo baixado dentro da amostra
    function prepararPreview() {
      return baixarVideo().then(function (b) {
        if (!videoLocal) {
          videoLocal = URL.createObjectURL(b);
          videoEl.src = videoLocal;
        }
      });
    }

    // Quando o primeiro quadro carrega, ele aparece e a imagem provisória sai
    // (assim as laterais da amostra ficam só com a cor de fundo)
    videoEl.addEventListener("loadeddata", function () {
      videoEl.style.opacity = 1;
      capaImg.style.display = "none";
    });

    // Já começa a baixar quando a página abre
    window.addEventListener("load", function () {
      if (urlVideo()) {
        prepararPreview().catch(function () {});
      }
    });


    // ==============================================================
    // 6) AMOSTRA DO VÍDEO (assistir, pausar e rever)
    // ==============================================================

    // Estados da amostra: "parado" (início ou pausado), "tocando" e "fim"
    function estadoPreview(estado) {
      videoCaixa.className = "video-share estado-" + estado;
    }

    // Toca (ou refaz) o vídeo
    function tocarPreview() {
      if (!urlVideo()) {
        avisar(MSG_SEM_VIDEO);
        return;
      }
      if (!videoLocal) {
        avisar(MSG_BAIXANDO);
      }
      prepararPreview().then(function () {
        if (videoEl.ended) {
          videoEl.currentTime = 0;
        }
        var p = videoEl.play();
        if (p && p.catch) {
          p.catch(function () {
            estadoPreview("parado");
            avisar(MSG_TOQUE_PARA_ASSISTIR);
          });
        }
      }).catch(function () {
        avisar(MSG_ERRO_BAIXAR);
      });
    }

    // Toque na amostra: assiste, pausa ou rever
    videoCaixa.addEventListener("click", function () {
      if (videoEl.paused || videoEl.ended) {
        tocarPreview();
      } else {
        videoEl.pause();
      }
    });

    // O vídeo começou a tocar
    videoEl.addEventListener("playing", function () {
      videoEl.style.opacity = 1;
      estadoPreview("tocando");
    });

    // O vídeo foi pausado no meio
    videoEl.addEventListener("pause", function () {
      if (!videoEl.ended) {
        estadoPreview("parado");
      }
    });

    // O vídeo terminou: fica parado no último quadro (dá para rever ou enviar)
    videoEl.addEventListener("ended", function () {
      estadoPreview("fim");
    });


    // ==============================================================
    // 7) COMPARTILHAR NO NAVEGADOR (modo de teste)
    // Abre o compartilhar do celular com o arquivo do vídeo.
    // Se o aparelho não permitir, baixa o vídeo.
    // ==============================================================

    // Baixa o arquivo para o aparelho (plano B)
    function salvarArquivo(blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = NOME_ARQUIVO;
      document.body.appendChild(a);
      a.click();
      a.remove();
      avisar(MSG_BAIXADO);
    }

    // Abre o compartilhar com o vídeo
    function compartilharNoNavegador(blob) {
      var arquivo = null;
      try {
        arquivo = new File([blob], NOME_ARQUIVO, { type: "video/mp4" });
      } catch (e) {}

      var pode = arquivo && navigator.canShare && navigator.canShare({ files: [arquivo] });

      if (pode) {
        navigator.share({ files: [arquivo] }).catch(function (err) {
          // "AbortError" = a pessoa fechou o menu, não é erro
          if (!err || err.name === "AbortError") {
            return;
          }
          // O celular só deixa compartilhar logo depois do toque
          if (err.name === "NotAllowedError") {
            avisar(MSG_TOQUE_DE_NOVO);
          } else {
            avisar(MSG_ERRO_SHARE);
          }
        });
      } else {
        salvarArquivo(blob);
      }
    }


    // ==============================================================
    // 8) BLOCO ANDROID
    // ==============================================================

    /* ##################################################################
       ########   INÍCIO DO BLOCO ANDROID — AJUSTAR DEPOIS   ########

       O QUE É
         Este trecho faz o botão "Enviar vídeo" chamar o próprio app
         Android, do mesmo jeito que o banner usava a função
         Android.shareImage. Só funciona quando MODO_ANDROID = true
         (lá no topo do arquivo, nas CONFIGURAÇÕES).

       O QUE FAZER QUANDO FOR TESTAR NO ANDROID
         1) No app Android, criar a função  shareVideo(url, nomeDoArquivo),
            parecida com a shareImage:
              - baixar o vídeo do link recebido (url) para a pasta de
                cache do app, com o nome recebido (nomeDoArquivo);
              - abrir o compartilhar do Android com esse arquivo
                (Intent ACTION_SEND, tipo "video/mp4").
         2) Lá no topo desta página, trocar
                var MODO_ANDROID = false;
            por
                var MODO_ANDROID = true;
         3) Testar no celular. Se o botão não fizer nada no Android,
            confira se a função shareVideo existe no app com esse nome.
            Se não existir, a página usa o compartilhar do navegador.

       OPÇÃO B (se preferir enviar o vídeo em vez do link)
         Em vez de passar o link, a página pode converter o vídeo em
         base64 e entregar ao app, como era feito com o banner.
         Para isso, o app precisaria de uma função
         shareVideoBase64(base64, nomeDoArquivo) e este trecho seria:

           var leitor = new FileReader();
           leitor.onload = function () {
             var base64 = leitor.result.split(",")[1];
             Android.shareVideoBase64(base64, NOME_ARQUIVO);
           };
           leitor.readAsDataURL(videoBlob);

         (O vídeo precisa já estar baixado: videoBlob.)
       ################################################################## */

    // Chama o app Android. Devolve true se conseguiu, false se não achou a função.
    function compartilharNoAndroid() {
      if (typeof Android === "undefined" || typeof Android.shareVideo !== "function") {
        return false;
      }
      Android.shareVideo(urlVideoCompleta(), NOME_ARQUIVO);
      return true;
    }

    /* ########   FIM DO BLOCO ANDROID   ######## */


    // ==============================================================
    // 9) BOTÃO "ENVIAR VÍDEO"
    // ==============================================================
    videoBtn.addEventListener("click", function () {

      // Sem link colado nas configurações
      if (!urlVideo()) {
        avisar(MSG_SEM_VIDEO);
        return;
      }

      // Modo Android: entrega para o app (se existir a função)
      if (MODO_ANDROID && compartilharNoAndroid()) {
        return;
      }

      // Modo navegador: vídeo já baixado, envia na hora
      if (videoBlob) {
        compartilharNoNavegador(videoBlob);
        return;
      }

      // Ainda baixando: espera e depois envia
      avisar(MSG_BAIXANDO);
      videoBtn.disabled = true;
      baixarVideo().then(function (b) {
        videoBtn.disabled = false;
        compartilharNoNavegador(b);
      }).catch(function () {
        videoBtn.disabled = false;
        avisar(MSG_ERRO_BAIXAR);
      });
    });

  </script>

</body>
