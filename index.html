<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Médica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F1F5F2;
    --surface: #FFFFFF;
    --ink: #1B2A26;
    --ink-soft: #5C6E68;
    --teal: #2C6259;
    --teal-soft: #DCE8E4;
    --amber: #B8863B;
    --amber-soft: #F3E7D2;
    --clay: #8C5A3C;
    --clay-soft: #EFE2D4;
    --line: #DCE3DF;
    --danger: #A2483A;
  }
  *{box-sizing:border-box;}
  body{
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  input, textarea, select{
    -webkit-user-select:text;
    user-select:text;
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:20px 20px 90px;
  }

  /* Perfil */
  .profile-bar{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:20px;
    cursor:pointer;
  }
  .avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:var(--teal-soft);
    color:var(--teal);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:600;
    font-size:18px;
    flex-shrink:0;
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .profile-info{ min-width:0; }
  .profile-name{
    margin:0;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .profile-id{
    margin:2px 0 0;
    font-size:12px;
    color:var(--ink-soft);
  }

  .app-title{
    font-family:'Lora', serif;
    font-weight:700;
    font-size:22px;
    color:var(--teal);
    text-align:left;
    margin:0 0 16px;
  }

  header{ margin-bottom:22px; }
  header h2.app-subtitle{
    font-family:'Lora', serif;
    font-weight:600;
    font-size:17px;
    color:var(--teal);
    margin:0 0 4px;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
  }

  .tabs{
    display:flex;
    gap:4px;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    white-space:nowrap;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    border:none;
    background:none;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    padding:10px 4px;
    margin-right:14px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    position:relative;
    top:1px;
    flex-shrink:0;
  }
  .tab.active{
    color:var(--teal);
    border-bottom:2px solid var(--teal);
    font-weight:500;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .card.done{ opacity:0.55; }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .card-title{
    font-weight:600;
    font-size:16px;
    margin:0 0 2px;
  }
  .card-sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:0;
  }
  .badge{
    font-size:11px;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
    font-weight:500;
  }
  .badge.exame{ background:var(--teal-soft); color:var(--teal); }
  .badge.consulta{ background:var(--amber-soft); color:var(--amber); }
  .badge.outros{ background:var(--clay-soft); color:var(--clay); }

  .card-date{
    margin-top:10px;
    font-size:14px;
    color:var(--ink);
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .card-date strong{ font-family:'Lora', serif; }
  .card-notes{
    margin-top:8px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .card{ cursor:pointer; }
  .action-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .action-btn{
    width:100%;
    text-align:left;
    padding:14px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--bg);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
  }
  .action-btn.primary{ color:var(--teal); border-color:var(--teal); }
  .action-btn.danger{ color:var(--danger); border-color:var(--danger); }

  .empty{
    text-align:center;
    padding:48px 20px;
    color:var(--ink-soft);
  }
  .empty p{ margin:6px 0 0; font-size:14px; }

  .fab-group{
    position:fixed;
    bottom:24px;
    right:24px;
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:center;
  }
  .fab, .fab-secondary{
    border:none;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(30,74,68,0.3);
  }
  .fab{
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--teal);
    color:#fff;
    font-size:28px;
    line-height:56px;
    text-align:center;
  }
  .fab-secondary{
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--surface);
    color:var(--teal);
    border:1px solid var(--line);
    font-size:18px;
    line-height:42px;
    text-align:center;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(27,42,38,0.4);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
  }
  .sheet{
    background:var(--surface);
    width:100%;
    max-width:640px;
    border-radius:16px 16px 0 0;
    padding:24px 20px 28px;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet h2{
    font-family:'Lora', serif;
    font-size:20px;
    color:var(--teal);
    margin:0 0 18px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    color:var(--ink);
    background:var(--bg);
  }
  .field textarea{ resize:vertical; min-height:56px; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }

  .time-picker{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .time-picker select{
    flex:1;
    text-align:center;
  }
  .time-picker span{ color:var(--ink-soft); font-weight:600; }

  .type-toggle{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .type-toggle button{
    flex:1;
    padding:10px 4px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--bg);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .type-toggle button.active.exame{ background:var(--teal-soft); border-color:var(--teal); color:var(--teal); }
  .type-toggle button.active.consulta{ background:var(--amber-soft); border-color:var(--amber); color:var(--amber); }
  .type-toggle button.active.outros{ background:var(--clay-soft); border-color:var(--clay); color:var(--clay); }

  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:8px;
  }
  .sheet-actions button{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:none;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  .btn-cancel{ background:var(--bg); color:var(--ink-soft); }
  .btn-save{ background:var(--teal); color:#fff; }

  .toast{
    position:fixed;
    left:50%;
    bottom:100px;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:13px;
    z-index:20;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
  }
  .toast.show{ opacity:1; }

  /* Perfil - editor */
  .avatar-edit{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
  }
  .avatar-large{
    width:88px;
    height:88px;
    border-radius:50%;
    background:var(--teal-soft);
    color:var(--teal);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:600;
    font-size:30px;
    overflow:hidden;
  }
  .avatar-large img{ width:100%; height:100%; object-fit:cover; }
  .btn-photo{
    font-size:13px;
    color:var(--teal);
    text-decoration:underline;
    cursor:pointer;
  }
  .profile-id-preview{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin:-6px 0 16px;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1 class="app-title">Agenda Médica</h1>

  <div class="profile-bar" id="profileBar">
    <div class="avatar" id="avatarWrap">
      <img id="avatarImg" style="display:none">
      <span id="avatarInitial">?</span>
    </div>
    <div class="profile-info">
      <p class="profile-name" id="profileNameText">Configurar perfil</p>
      <p class="profile-id" id="profileIdText"></p>
    </div>
  </div>

  <header>
    <h2 class="app-subtitle">Meus Compromissos</h2>
    <p>Exames, consultas e outros, em um só lugar</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="proximos">Próximos</button>
    <button class="tab" data-tab="concluidos">Concluídos</button>
    <button class="tab" data-tab="pendentes">Pendentes</button>
    <button class="tab" data-tab="especiais">Prioridades</button>
  </div>

  <div id="list"></div>
</div>

<div class="fab-group">
  <button class="fab-secondary" id="fabShare" aria-label="Compartilhar como imagem">⇪</button>
  <button class="fab" id="fabAdd" aria-label="Adicionar compromisso">+</button>
</div>

<!-- Modal de compromisso -->
<div class="overlay" id="overlay" style="display:none;">
  <div class="sheet">
    <h2 id="sheetTitle">Novo compromisso</h2>
    <div class="type-toggle">
      <button type="button" class="active consulta" id="typeConsulta">Consulta</button>
      <button type="button" class="exame" id="typeExame">Exame</button>
      <button type="button" class="outros" id="typeOutros">Outros</button>
    </div>
    <div class="field">
      <label for="fTitulo">Título</label>
      <input id="fTitulo" placeholder="Ex: Hemograma completo / Cardiologista">
    </div>
    <div class="field">
      <label>Data</label>
      <div class="time-picker">
        <select id="fDia"></select>
        <span>/</span>
        <select id="fMes"></select>
        <span>/</span>
        <select id="fAno"></select>
      </div>
    </div>
    <div class="field">
      <label>Hora</label>
      <div class="time-picker">
        <select id="fHoraH"></select>
        <span>:</span>
        <select id="fHoraM"></select>
      </div>
    </div>
    <div class="field">
      <label for="fLocal">Local / Especialidade</label>
      <input id="fLocal" placeholder="Ex: Laboratório Central, Dr. Souza">
    </div>
    <div class="field">
      <label for="fNotas">Observações (opcional)</label>
      <textarea id="fNotas" placeholder="Jejum de 8h, levar exames anteriores..."></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="btnCancel">Cancelar</button>
      <button class="btn-save" id="btnSave">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal de perfil -->
<div class="overlay" id="profileOverlay" style="display:none;">
  <div class="sheet">
    <h2>Seu perfil</h2>
    <div class="avatar-edit">
      <div class="avatar-large" id="avatarLargeWrap">
        <img id="avatarLargeImg" style="display:none">
        <span id="avatarLargeInitial">?</span>
      </div>
      <label class="btn-photo" for="fFoto">Escolher foto</label>
      <input type="file" id="fFoto" accept="image/*" style="display:none">
    </div>
    <div class="field">
      <label for="fNome">Nome</label>
      <input id="fNome" placeholder="Seu nome">
    </div>
    <p class="profile-id-preview" id="profileIdPreview"></p>
    <div class="sheet-actions">
      <button class="btn-cancel" id="btnProfileCancel">Cancelar</button>
      <button class="btn-save" id="btnProfileSave">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal de ações do card -->
<div class="overlay" id="actionOverlay" style="display:none;">
  <div class="sheet">
    <div id="actionMainView">
      <h2 id="actionSheetTitle">Compromisso</h2>
      <div class="action-list">
        <button class="action-btn primary" id="actBtnDone"></button>
        <button class="action-btn" id="actBtnEspecial"></button>
        <button class="action-btn" id="actBtnEdit">Editar</button>
        <button class="action-btn" id="actBtnShare">Compartilhar</button>
        <button class="action-btn danger" id="actBtnDelete">Excluir</button>
      </div>
      <div class="sheet-actions" style="margin-top:16px;">
        <button class="btn-cancel" id="btnActionCancel">Fechar</button>
      </div>
    </div>
    <div id="actionConfirmView" style="display:none;">
      <h2>Excluir compromisso?</h2>
      <p style="color:var(--ink-soft); font-size:14px; margin:0 0 20px;">Essa ação não pode ser desfeita.</p>
      <div class="sheet-actions">
        <button class="btn-cancel" id="btnDeleteCancel">Cancelar</button>
        <button class="btn-save" style="background:var(--danger);" id="btnDeleteConfirm">Excluir</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal de compartilhamento individual -->
<div class="toast" id="toast"></div>

<script>
  /* ---------- IndexedDB ---------- */
  const DB_NAME = 'compromissosDB';
  const DB_VERSION = 1;
  let dbInstance = null;

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains('compromissos')){
          db.createObjectStore('compromissos', { keyPath: 'id' });
        }
        if(!db.objectStoreNames.contains('perfil')){
          db.createObjectStore('perfil', { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e.target.error);
    });
  }

  function dbGetAll(store){
    return new Promise((resolve, reject) => {
      const tx = dbInstance.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function dbGet(store, key){
    return new Promise((resolve, reject) => {
      const tx = dbInstance.transaction(store, 'readonly');
      const req = tx.objectStore(store).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function dbPut(store, value){
    return new Promise((resolve, reject) => {
      const tx = dbInstance.transaction(store, 'readwrite');
      tx.objectStore(store).put(value);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function dbDelete(store, key){
    return new Promise((resolve, reject) => {
      const tx = dbInstance.transaction(store, 'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  /* ---------- Estado ---------- */
  let items = [];
  let perfil = null;
  let currentTab = 'proximos';
  let currentType = 'exame';
  let editingId = null;

  const listEl = document.getElementById('list');
  const overlay = document.getElementById('overlay');
  const profileOverlay = document.getElementById('profileOverlay');

  /* ---------- Utilitários ---------- */
  function formatDate(dateStr){
    if(!dateStr) return '';
    const [y,m,d] = dateStr.split('-');
    return `${d}/${m}/${y}`;
  }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function tipoLabel(tipo){
    return tipo === 'exame' ? 'Exame' : tipo === 'consulta' ? 'Consulta' : 'Outros';
  }
  function generateUserId(){
    return 'US-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  }
  function diaSemana(dateStr){
    const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const [y,m,d] = dateStr.split('-').map(Number);
    return dias[new Date(y, m - 1, d).getDay()];
  }
  function isPastDate(dateStr){
    const hoje = new Date();
    hoje.setHours(0,0,0,0);
    const [y,m,d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d) < hoje;
  }

  /* ---------- Renderização de compromissos ---------- */
  function render(){
    let filtered;
    let emptyMsg = '';

    if(currentTab === 'proximos'){
      filtered = items.filter(it => !it.done && !isPastDate(it.data));
      emptyMsg = 'Nenhum compromisso marcado ainda. Toque em + para adicionar.';
    } else if(currentTab === 'concluidos'){
      filtered = items.filter(it => it.done);
      emptyMsg = 'Nenhum compromisso concluído ainda.';
    } else if(currentTab === 'pendentes'){
      filtered = items.filter(it => !it.done && isPastDate(it.data));
      emptyMsg = 'Nenhuma pendência. Tudo em dia!';
    } else if(currentTab === 'especiais'){
      filtered = items.filter(it => it.especial);
      emptyMsg = 'Nenhum compromisso marcado como prioridade ainda.';
    }

    filtered.sort((a,b) => {
      const da = new Date(a.data + 'T' + (a.hora || '00:00'));
      const db_ = new Date(b.data + 'T' + (b.hora || '00:00'));
      return currentTab === 'concluidos' ? db_ - da : da - db_;
    });

    if(filtered.length === 0){
      listEl.innerHTML = `<div class="empty"><p>${emptyMsg}</p></div>`;
      return;
    }

    listEl.innerHTML = filtered.map(it => `
      <div class="card ${it.done ? 'done' : ''}" onclick="openActionSheet('${it.id}')">
        <div class="card-top">
          <div>
            <p class="card-title">${it.especial ? '★ ' : ''}${escapeHtml(it.titulo)}</p>
            <p class="card-sub">${escapeHtml(it.local || '')}</p>
          </div>
          <span class="badge ${it.tipo}">${tipoLabel(it.tipo)}</span>
        </div>
        <div class="card-date"><strong>${diaSemana(it.data)}, ${formatDate(it.data)}</strong>${it.hora ? ' às ' + it.hora : ''}</div>
        ${it.notas ? `<div class="card-notes">${escapeHtml(it.notas)}</div>` : ''}
      </div>
    `).join('');
  }

  window.markDone = async function(id){
    const it = items.find(i => i.id === id);
    if(it){ it.done = true; await dbPut('compromissos', it); render(); }
  };
  window.markPending = async function(id){
    const it = items.find(i => i.id === id);
    if(it){ it.done = false; await dbPut('compromissos', it); render(); }
  };
  window.removeItem = async function(id){
    items = items.filter(i => i.id !== id);
    await dbDelete('compromissos', id);
    render();
  };
  window.toggleEspecial = async function(id){
    const it = items.find(i => i.id === id);
    if(it){ it.especial = !it.especial; await dbPut('compromissos', it); render(); }
  };

  /* ---------- Menu de ações do card ---------- */
  const actionOverlay = document.getElementById('actionOverlay');
  const actionMainView = document.getElementById('actionMainView');
  const actionConfirmView = document.getElementById('actionConfirmView');
  let actionItemId = null;

  function closeActionOverlay(){
    actionOverlay.style.display = 'none';
    actionMainView.style.display = 'block';
    actionConfirmView.style.display = 'none';
  }

  window.openActionSheet = function(id){
    const it = items.find(i => i.id === id);
    if(!it) return;
    actionItemId = id;
    document.getElementById('actionSheetTitle').textContent = it.titulo;
    document.getElementById('actBtnDone').textContent = it.done ? 'Reabrir' : 'Marcar concluído';
    document.getElementById('actBtnEspecial').textContent = it.especial ? 'Remover prioridade' : 'Marcar prioridade';
    actionMainView.style.display = 'block';
    actionConfirmView.style.display = 'none';
    actionOverlay.style.display = 'flex';
  };

  document.getElementById('btnActionCancel').addEventListener('click', closeActionOverlay);
  actionOverlay.addEventListener('click', (e) => { if(e.target === actionOverlay) closeActionOverlay(); });

  document.getElementById('actBtnDone').addEventListener('click', async () => {
    const it = items.find(i => i.id === actionItemId);
    if(it){ it.done = !it.done; await dbPut('compromissos', it); }
    closeActionOverlay();
    render();
  });
  document.getElementById('actBtnEspecial').addEventListener('click', async () => {
    const it = items.find(i => i.id === actionItemId);
    if(it){ it.especial = !it.especial; await dbPut('compromissos', it); }
    closeActionOverlay();
    render();
  });
  document.getElementById('actBtnEdit').addEventListener('click', () => {
    closeActionOverlay();
    editItem(actionItemId);
  });
  document.getElementById('actBtnShare').addEventListener('click', () => {
    closeActionOverlay();
    shareItem(actionItemId);
  });
  document.getElementById('actBtnDelete').addEventListener('click', () => {
    actionMainView.style.display = 'none';
    actionConfirmView.style.display = 'block';
  });
  document.getElementById('btnDeleteCancel').addEventListener('click', () => {
    actionMainView.style.display = 'block';
    actionConfirmView.style.display = 'none';
  });
  document.getElementById('btnDeleteConfirm').addEventListener('click', () => {
    closeActionOverlay();
    removeItem(actionItemId);
  });
  window.editItem = function(id){
    const it = items.find(i => i.id === id);
    if(!it) return;
    editingId = id;
    document.getElementById('sheetTitle').textContent = 'Editar compromisso';
    setType(it.tipo);
    document.getElementById('fTitulo').value = it.titulo;
    setDataSelects(it.data);
    const [h, m] = (it.hora || '08:00').split(':');
    document.getElementById('fHoraH').value = h;
    document.getElementById('fHoraM').value = m;
    document.getElementById('fLocal').value = it.local || '';
    document.getElementById('fNotas').value = it.notas || '';
    overlay.style.display = 'flex';
  };

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      render();
    });
  });

  function setType(type){
    currentType = type;
    document.getElementById('typeExame').classList.toggle('active', type === 'exame');
    document.getElementById('typeConsulta').classList.toggle('active', type === 'consulta');
    document.getElementById('typeOutros').classList.toggle('active', type === 'outros');
  }
  document.getElementById('typeExame').addEventListener('click', () => setType('exame'));
  document.getElementById('typeConsulta').addEventListener('click', () => setType('consulta'));
  document.getElementById('typeOutros').addEventListener('click', () => setType('outros'));

  /* ---------- Seletor de hora próprio ---------- */
  function fillTimeSelects(){
    const selH = document.getElementById('fHoraH');
    const selM = document.getElementById('fHoraM');
    selH.innerHTML = '';
    selM.innerHTML = '';
    for(let h = 0; h < 24; h++){
      const v = String(h).padStart(2, '0');
      selH.innerHTML += `<option value="${v}">${v}</option>`;
    }
    for(let m = 0; m < 60; m += 5){
      const v = String(m).padStart(2, '0');
      selM.innerHTML += `<option value="${v}">${v}</option>`;
    }
  }

  function fillDateSelects(){
    const selDia = document.getElementById('fDia');
    const selMes = document.getElementById('fMes');
    const selAno = document.getElementById('fAno');
    selDia.innerHTML = '';
    selMes.innerHTML = '';
    selAno.innerHTML = '';
    for(let d = 1; d <= 31; d++){
      const v = String(d).padStart(2, '0');
      selDia.innerHTML += `<option value="${v}">${v}</option>`;
    }
    const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    meses.forEach((nome, i) => {
      const v = String(i + 1).padStart(2, '0');
      selMes.innerHTML += `<option value="${v}">${nome}</option>`;
    });
    const anoAtual = new Date().getFullYear();
    for(let a = anoAtual - 1; a <= anoAtual + 5; a++){
      selAno.innerHTML += `<option value="${a}">${a}</option>`;
    }
  }

  function getDataSelecionada(){
    const dia = document.getElementById('fDia').value;
    const mes = document.getElementById('fMes').value;
    const ano = document.getElementById('fAno').value;
    return `${ano}-${mes}-${dia}`;
  }

  function setDataSelects(dataStr){
    const hoje = new Date();
    const [ano, mes, dia] = (dataStr || '').split('-');
    document.getElementById('fDia').value = dia || String(hoje.getDate()).padStart(2,'0');
    document.getElementById('fMes').value = mes || String(hoje.getMonth()+1).padStart(2,'0');
    document.getElementById('fAno').value = ano || String(hoje.getFullYear());
  }

  function openNewSheet(){
    editingId = null;
    document.getElementById('sheetTitle').textContent = 'Novo compromisso';
    setType('consulta');
    document.getElementById('fTitulo').value = '';
    setDataSelects(null);
    document.getElementById('fHoraH').value = '08';
    document.getElementById('fHoraM').value = '00';
    document.getElementById('fLocal').value = '';
    document.getElementById('fNotas').value = '';
    overlay.style.display = 'flex';
  }

  document.getElementById('fabAdd').addEventListener('click', openNewSheet);
  document.getElementById('btnCancel').addEventListener('click', () => { overlay.style.display = 'none'; });
  overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.style.display = 'none'; });

  document.getElementById('btnSave').addEventListener('click', async () => {
    const titulo = document.getElementById('fTitulo').value.trim();
    const data = getDataSelecionada();
    if(!titulo || !data){
      alert('Preencha ao menos o título e a data.');
      return;
    }
    const hora = document.getElementById('fHoraH').value + ':' + document.getElementById('fHoraM').value;
    const payload = {
      titulo,
      data,
      hora,
      local: document.getElementById('fLocal').value.trim(),
      notas: document.getElementById('fNotas').value.trim(),
      tipo: currentType,
    };
    if(editingId){
      const it = items.find(i => i.id === editingId);
      Object.assign(it, payload);
      await dbPut('compromissos', it);
    } else {
      const novo = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), done:false, ...payload };
      items.push(novo);
      await dbPut('compromissos', novo);
    }
    overlay.style.display = 'none';
    render();
  });

  /* ---------- Perfil ---------- */
  let novaFotoBase64 = null;

  function renderProfileBar(){
    const nameEl = document.getElementById('profileNameText');
    const idEl = document.getElementById('profileIdText');
    const avatarImg = document.getElementById('avatarImg');
    const avatarInitial = document.getElementById('avatarInitial');

    if(perfil && perfil.nome){
      nameEl.textContent = perfil.nome;
      idEl.textContent = perfil.userId || '';
      avatarInitial.textContent = perfil.nome.trim().charAt(0).toUpperCase();
    } else {
      nameEl.textContent = 'Configurar perfil';
      idEl.textContent = '';
      avatarInitial.textContent = '?';
    }

    if(perfil && perfil.foto){
      avatarImg.src = perfil.foto;
      avatarImg.style.display = 'block';
      avatarInitial.style.display = 'none';
    } else {
      avatarImg.style.display = 'none';
      avatarInitial.style.display = 'block';
    }
  }

  document.getElementById('profileBar').addEventListener('click', () => {
    novaFotoBase64 = null;
    const nomeAtual = perfil ? perfil.nome || '' : '';
    document.getElementById('fNome').value = nomeAtual;

    const previewImg = document.getElementById('avatarLargeImg');
    const previewInitial = document.getElementById('avatarLargeInitial');
    if(perfil && perfil.foto){
      previewImg.src = perfil.foto;
      previewImg.style.display = 'block';
      previewInitial.style.display = 'none';
    } else {
      previewImg.style.display = 'none';
      previewInitial.style.display = 'block';
      previewInitial.textContent = nomeAtual ? nomeAtual.trim().charAt(0).toUpperCase() : '?';
    }

    document.getElementById('profileIdPreview').textContent = perfil && perfil.userId
      ? 'ID: ' + perfil.userId
      : 'Um ID único será gerado ao salvar';

    profileOverlay.style.display = 'flex';
  });

  document.getElementById('btnProfileCancel').addEventListener('click', () => { profileOverlay.style.display = 'none'; });
  profileOverlay.addEventListener('click', (e) => { if(e.target === profileOverlay) profileOverlay.style.display = 'none'; });

  document.getElementById('fFoto').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      novaFotoBase64 = reader.result;
      const previewImg = document.getElementById('avatarLargeImg');
      const previewInitial = document.getElementById('avatarLargeInitial');
      previewImg.src = novaFotoBase64;
      previewImg.style.display = 'block';
      previewInitial.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('btnProfileSave').addEventListener('click', async () => {
    const nome = document.getElementById('fNome').value.trim();
    if(!nome){
      alert('Informe um nome.');
      return;
    }
    if(!perfil){
      perfil = { id: 1, nome, foto: null, userId: generateUserId() };
    } else {
      perfil.nome = nome;
      if(!perfil.userId) perfil.userId = generateUserId();
    }
    if(novaFotoBase64){
      perfil.foto = novaFotoBase64;
    }
    await dbPut('perfil', perfil);
    renderProfileBar();
    profileOverlay.style.display = 'none';
  });

  /* ---------- Compartilhar como PNG (formato A4, com paginação) ---------- */
  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  const PAGE_W = 794;   // A4 a 96dpi
  const PAGE_H = 1123;
  const MARGIN = 40;
  const ROW_H = 100;

  // Logo: se existir o arquivo imagens/logo.png, ele é usado.
  // Se não existir, desenharLogo() desenha um ícone provisório no lugar.
  // Quando a logo oficial estiver pronta, basta colocar o arquivo em imagens/logo.png — nada aqui precisa mudar.
  let logoImg = null;
  function carregarLogo(){
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => { logoImg = img; resolve(); };
      img.onerror = () => { logoImg = null; resolve(); };
      img.src = 'imagens/logo.png';
    });
  }

  function desenharLogo(ctx){
    const tam = 56;
    const x = PAGE_W - MARGIN - tam;
    const y = MARGIN - 20;

    if(logoImg){
      ctx.drawImage(logoImg, x, y, tam, tam);
      return;
    }

    // Ícone provisório: cruz médica em círculo
    const cx = x + tam / 2;
    const cy = y + tam / 2;
    ctx.fillStyle = '#DCE8E4';
    ctx.beginPath();
    ctx.arc(cx, cy, tam / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2C6259';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#2C6259';
    const braco = tam * 0.16;
    const comp = tam * 0.5;
    ctx.fillRect(cx - braco / 2, cy - comp / 2, braco, comp);
    ctx.fillRect(cx - comp / 2, cy - braco / 2, comp, braco);
  }

  function drawItemRow(ctx, it, x, y, width){
    const h = ROW_H - 14;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(x, y, width, h);
    ctx.strokeStyle = '#DCE3DF';
    ctx.strokeRect(x, y, width, h);

    ctx.fillStyle = '#1B2A26';
    ctx.font = '600 18px Arial';
    ctx.fillText((it.especial ? '★ ' : '') + it.titulo, x + 16, y + 28);

    ctx.fillStyle = '#5C6E68';
    ctx.font = '14px Arial';
    ctx.fillText(it.local || '', x + 16, y + 50);

    ctx.fillStyle = '#2C6259';
    ctx.font = '600 15px Arial';
    const dataTxt = diaSemana(it.data) + ', ' + formatDate(it.data) + (it.hora ? ' às ' + it.hora : '');
    ctx.fillText(dataTxt + '   [' + tipoLabel(it.tipo) + ']', x + 16, y + 72);
  }

  function buildPages(itemsList, titulo){
    const pages = [];
    let idx = 0;
    do {
      const canvas = document.createElement('canvas');
      canvas.width = PAGE_W;
      canvas.height = PAGE_H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, PAGE_W, PAGE_H);

      let y = MARGIN;
      desenharLogo(ctx);
      ctx.fillStyle = '#2C6259';
      ctx.font = '600 26px Georgia, serif';
      ctx.fillText('Agenda Médica', MARGIN, y);
      y += 30;

      if(perfil && perfil.nome){
        ctx.fillStyle = '#1B2A26';
        ctx.font = '600 16px Arial';
        ctx.fillText(perfil.nome + (perfil.userId ? '  ·  ' + perfil.userId : ''), MARGIN, y);
        y += 22;
      }

      ctx.fillStyle = '#5C6E68';
      ctx.font = '13px Arial';
      ctx.fillText(titulo, MARGIN, y);
      y += 26;

      const limiteY = PAGE_H - MARGIN - 30;
      while(idx < itemsList.length && (y + ROW_H) <= limiteY){
        drawItemRow(ctx, itemsList[idx], MARGIN, y, PAGE_W - MARGIN * 2);
        y += ROW_H;
        idx++;
      }

      ctx.fillStyle = '#5C6E68';
      ctx.font = '12px Arial';
      ctx.fillText('Página ' + (pages.length + 1), PAGE_W - MARGIN - 70, PAGE_H - 20);

      pages.push(canvas);
    } while(idx < itemsList.length);
    return pages;
  }

  async function shareCanvases(canvasList, baseName){
    const blobs = await Promise.all(canvasList.map(c => new Promise(res => c.toBlob(res, 'image/png'))));
    const files = blobs.map((b, i) => new File([b], `${baseName}-pagina-${i + 1}.png`, { type: 'image/png' }));

    if(navigator.canShare && navigator.canShare({ files })){
      try {
        await navigator.share({ files, title: baseName });
        return;
      } catch(e){ /* usuário cancelou, cai no download */ }
    }
    files.forEach((f, i) => {
      setTimeout(() => {
        const url = URL.createObjectURL(f);
        const a = document.createElement('a');
        a.href = url;
        a.download = f.name;
        a.click();
        URL.revokeObjectURL(url);
      }, i * 300);
    });
  }

  document.getElementById('fabShare').addEventListener('click', async () => {
    const proximos = items.filter(i => !i.done).sort((a,b) => new Date(a.data+'T'+(a.hora||'00:00')) - new Date(b.data+'T'+(b.hora||'00:00')));
    if(proximos.length === 0){
      showToast('Não há compromissos para compartilhar.');
      return;
    }
    const pages = buildPages(proximos, 'Meus Compromissos');
    await shareCanvases(pages, 'meus-compromissos');
  });

  window.shareItem = async function(id){
    const it = items.find(i => i.id === id);
    if(!it) return;
    const pages = buildPages([it], 'Compromisso');
    const nomeArquivo = 'compromisso-' + it.titulo.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
    await shareCanvases(pages, nomeArquivo);
  };

  /* ---------- Inicialização ---------- */
  async function init(){
    fillTimeSelects();
    fillDateSelects();
    carregarLogo();
    dbInstance = await openDB();
    items = await dbGetAll('compromissos');
    perfil = await dbGet('perfil', 1) || null;
    renderProfileBar();
    render();
  }
  init();
</script>
