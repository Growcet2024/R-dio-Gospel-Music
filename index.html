<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moldura</title>

<style>
  /* ===== VARIÁVEIS DE COR ===== */
  :root{
    --teal-soft: #cfe8e6; /* cor inicial do degradê de fundo da página (computador) */
    --amber-soft: #f3e3c3; /* cor final do degradê de fundo da página (computador) */
    --ink: #1B1B1F; /* cor do texto informativo estático (computador) */
  }

  /* ===== PÁGINA (padrão = celular) ===== */
  body{
    margin:0;
    height:100vh;
    font-family:'IBM Plex Sans', Arial, sans-serif;
  }

  /* ===== PÁGINA (computador, 900px+) =====
     Centraliza a moldura na tela e aplica o fundo degradê */
  @media (min-width: 900px){
    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:40px 20px;          /* respiro nas bordas da janela */
      gap:20px;                   /* espaço entre a moldura e o texto informativo */
      background:linear-gradient(160deg, #cfe8e6 0%, #f3e3c3 100%);  /* ===== cor fundo gradient ===== */
    }
  }

  /* ===== ESCONDER A MOLDURA NO CELULAR =====
     No celular o app abre em tela cheia, sem casca de iPhone em volta */
  .phone-frame-scaler{ display:contents; }
  .phone-frame{ display:contents; }
  .phone-screen{ display:contents; }
  .phone-notch, .phone-statusbar, .phone-home-indicator{ display:none; }

  /* ===== MOLDURA COMPLETA (computador, 900px+) ===== */
  @media (min-width: 900px){

    .phone-frame-scaler{
      display:inline-block;      /* encolhido/ampliado via JS (ajustarEscalaMoldura) */
    }

    /* Carcaça do celular */
    .phone-frame{
      display:block;
      position:relative;
      width:430px;                /* largura "natural" do celular */
      height:844px;                /* altura "natural" do celular */
      background:#1B1B1F;          /* cor da carcaça */
      border-radius:52px;          /* arredondamento das bordas */
      padding:14px;                 /* espessura da borda ao redor da tela */
      box-shadow:0 30px 60px rgba(0,0,0,0.35); /* sombra do celular */
      transform-origin:top left;    /* ponto de referência ao encolher (escala) */
    }

    /* Notch (entalhe preto no topo) */
    .phone-notch{
      display:block;
      position:absolute;
      top:14px;
      left:50%;
      transform:translateX(-50%);
      width:120px;
      height:28px;
      background:#1B1B1F;          /* cor do notch */
      border-radius:0 0 18px 18px;
      z-index:5;
    }

    /* Tela do celular (onde o app/iframe entra) */
    .phone-screen{
      display:flex;
      flex-direction:column;
      position:relative;
      width:100%;
      height:100%;
      background:#ffffff;          /* cor de fundo da tela, antes do app carregar */
      border-radius:38px;
      overflow:hidden;
    }

    /* Barra de status (relógio + bateria) no topo da tela */
    .phone-statusbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 26px 4px;
      font-size:13px;
      font-weight:600;
      color:#1B1B1F;                /* cor do texto do relógio/bateria */
      font-family:'IBM Plex Sans', Arial, sans-serif;
      flex-shrink:0;
    }

    /* Barrinha home na base da tela */
    .phone-home-indicator{
      display:block;
      position:absolute;
      bottom:8px;
      left:50%;
      transform:translateX(-50%);
      width:120px;
      height:4px;
      border-radius:4px;
      background:rgba(0,0,0,0.15);  /* cor da barrinha home */
    }
  }

  /* ===== IFRAME (onde o app real carrega) =====
     Padrão (celular): ocupa a tela inteira do navegador */
  .phone-screen iframe{
    width:100%;
    height:100vh;
    border:none;
    display:block;
  }

  /* No computador, o iframe ocupa só o espaço restante dentro da tela do celular */
  @media (min-width: 900px){
    .phone-screen iframe{
      height:auto;
      flex:1;
    }
  }

  /* ===== TEXTO INFORMATIVO =====
     Celular: faixa fixa embaixo, com o texto rolando.
     Computador (900px+): texto estático abaixo da moldura, parado. */
  .texto-informativo{
    display:block;
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    overflow:hidden;
    white-space:nowrap;
    background:#00000099;    /* ===== cor de fundo da faixa (celular) ===== */
    color:#ffffff;            /* ===== cor do texto rolando (celular) ===== */
    font-size:13px;
    padding:6px 0;
    z-index:9999;
  }

  /* O texto em si, dentro da faixa — é ele que se move */
  .texto-informativo span{
    display:inline-block;
    padding-left:100%;         /* começa fora da tela, à direita */
    animation: rolar-texto-informativo 12s linear infinite; /* velocidade da rolagem (12s) */
  }

  /* Animação: desliza o texto da direita pra esquerda */
  @keyframes rolar-texto-informativo{
    from{ transform:translateX(0); }
    to{ transform:translateX(-100%); }
  }

  /* No computador, o texto fica parado e estático abaixo da moldura */
  @media (min-width: 900px){
    .texto-informativo{
      position:static;
      width:auto;
      overflow:visible;
      white-space:normal;
      background:none;
      color:var(--ink);         /* cor do texto estático (computador) */
      opacity:0.8;
      font-size:14px;
      max-width:430px;
      text-align:center;
      padding:0;
    }

    .texto-informativo span{
      display:inline;
      padding-left:0;
      animation:none;           /* sem rolagem no computador */
    }
  }
</style>
</head>
<body>

<div class="phone-frame-scaler" id="phoneFrameScaler">
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <div class="phone-statusbar">
        <span id="phoneClock">00:00</span>
        <span class="phone-status-icons">••• 🔋</span>
      </div>
      <!-- 📌 TROQUE A URL ABAIXO PELA PÁGINA DO APP QUE QUER MOSTRAR -->
    <iframe src="https://vida-leve-beta.web.app/"></iframe>
    </div>
    <div class="phone-home-indicator"></div>
  </div>
</div>

<div class="texto-informativo" id="textoInformativo">
  <span id="textoInformativoConteudo"></span>
</div>

<script>
  /* ===== TEXTO INFORMATIVO — guardado no localStorage da PRÓPRIA
     página da moldura (não interfere em nada do app de dentro do
     iframe, que continua salvando do jeito que já salva hoje) ===== */

  const CHAVE_TEXTO = "moldura-texto-informativo";
  const TEXTO_PADRAO = "Escaneie ou abra pelo celular para a melhor experiência.";

  function lerTextoInformativo(){
    return localStorage.getItem(CHAVE_TEXTO) || TEXTO_PADRAO;
  }

  function salvarTextoInformativo(novoTexto){
    localStorage.setItem(CHAVE_TEXTO, novoTexto);
  }

  document.getElementById("textoInformativoConteudo").textContent = lerTextoInformativo();
</script>

<script>
  /* ===== ENCOLHER A MOLDURA PROPORCIONALMENTE ===== */
  function ajustarEscalaMoldura(){
    const frame = document.querySelector('.phone-frame');
    const scaler = document.getElementById('phoneFrameScaler');
    if(!frame || !scaler) return;

    const larguraNatural = 430;
    const alturaNatural = 844;
    const margem = 80; // respiro nas bordas da tela

    const alturaDisponivel = window.innerHeight - margem - 60; // 60px reservados pro texto abaixo
    const larguraDisponivel = window.innerWidth - margem;

    let escala = Math.min(alturaDisponivel / alturaNatural, larguraDisponivel / larguraNatural, 1);
    if(escala < 0.4) escala = 0.4;

    frame.style.transform = 'scale(' + escala + ')';
    scaler.style.width = (larguraNatural * escala) + 'px';
    scaler.style.height = (alturaNatural * escala) + 'px';
  }
  ajustarEscalaMoldura();
  window.addEventListener('resize', ajustarEscalaMoldura);
</script>

<script>
  function atualizarRelogioMoldura(){
    const el = document.getElementById('phoneClock');
    if(!el) return;
    const agora = new Date();
    const h = String(agora.getHours()).padStart(2, '0');
    const m = String(agora.getMinutes()).padStart(2, '0');
    el.textContent = h + ':' + m;
  }
  atualizarRelogioMoldura();
  setInterval(atualizarRelogioMoldura, 15000);
</script>

</body>
</html>
